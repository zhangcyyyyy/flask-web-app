name: Deploy Flask App to Touge Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pytest tests/ -v
        continue-on-error: false

      - name: Deploy to Touge Server (Port 51595)
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.TOUGE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 51595 -H ${{ secrets.TOUGE_SERVER_IP }} >> ~/.ssh/known_hosts

          echo "=== 1. 上传代码到服务器 ==="
          ssh -p 51595 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa root@${{ secrets.TOUGE_SERVER_IP }} "mkdir -p /root/flask-web-app/src /root/flask-web-app/tests"
          scp -P 51595 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            src/app.py src/__init__.py \
            root@${{ secrets.TOUGE_SERVER_IP }}:/root/flask-web-app/src/
          scp -P 51595 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            tests/test_app.py \
            root@${{ secrets.TOUGE_SERVER_IP }}:/root/flask-web-app/tests/
          scp -P 51595 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            requirements.txt \
            root@${{ secrets.TOUGE_SERVER_IP }}:/root/flask-web-app/

          echo "=== 2. 安装依赖并重启 ==="
          ssh -p 51595 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa root@${{ secrets.TOUGE_SERVER_IP }} << 'EOF'
            set -e
            cd /root/flask-web-app
            pip3 install -r requirements.txt -q
            supervisorctl restart flask-web-app
            supervisorctl status flask-web-app
            echo "部署完成"
          EOF
        env:
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
